[project]
name = "kitzur-hub-backend"
version = "0.1.0"
description = "Kitzur Hub API: courses, lectures, tasks and transcript import."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# D: docstrings on every module, class and function (project hard rule).
select = ["E", "F", "I", "UP", "B", "SIM", "D", "RUF"]
# UP037: SQLModel relationships need quoted forward references ("Lecture").
# RUF001-003: Hebrew letters (e.g. vav) are flagged as look-alikes of Latin ones.
ignore = ["D203", "D213", "UP037", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"
