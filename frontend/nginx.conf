# Serves the built app and forwards /api to the backend container.
server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Client-side routes (/courses/1/tasks) must load the app on a reload.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: the browser never talks to the backend directly, so no CORS.
    # The trailing slash strips the /api prefix (backend routes have none).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads are capped at 5 MB by the backend; allow the multipart overhead on top.
        client_max_body_size 6m;
        proxy_read_timeout 60s;
    }

    # Liveness for Docker and Compose health checks.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
